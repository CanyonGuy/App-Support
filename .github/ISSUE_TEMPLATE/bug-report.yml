name: Bug Report
description: File a structured bug report for iOS
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        ### Submit a Bug Report
        Please fill out the details below to report an iOS application crash or malfunction.
        
  - type: dropdown
    id: ios-version
    attributes:
      label: iOS Version
      description: Select the iOS version where the bug occurs.
      options:
        - iOS 19
        - iOS 18
        - iOS 17
    validations:
      required: true
