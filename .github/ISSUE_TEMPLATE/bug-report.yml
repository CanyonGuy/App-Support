name: Bug Report
description: This description only shows up on the "Choose a template" menu.
title: "[Bug]: "
body:
  # 1. This displays your description text directly inside the form:
  - type: markdown
    attributes:
      value: |
        ### Submit a Bug Report
        Please fill out the details below to report an iOS application crash or malfunction.
        
  # 2. Your dropdown menu:
  - type: dropdown
    id: ios-version
    attributes:
      label: iOS Version
      description: Select the iOS version where the bug occurs.
      options:
        - iOS 19
        - iOS 18
        - iOS 17
    validations:
      required: true
